[package]
name = "happy_eyeballs_glue"
version = "0.1.0"
authors = ["The Mozilla Necko Team <necko@mozilla.com>"]
edition = "2021"
license = "MPL-2.0"
description = "FFI glue layer between happy-eyeballs Rust crate and Firefox's C++ networking stack"

[dependencies]
happy-eyeballs = { branch = "master", git = "https://github.com/mxinden/happy-eyeballs" }
# TODO: restrict?!
tracing = "0.1"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "std", "env-filter"] }
nserror = { path = "../../../../xpcom/rust/nserror" }
nsstring = { path = "../../../../xpcom/rust/nsstring" }
xpcom = { path = "../../../../xpcom/rust/xpcom" }
thin-vec = { version = "0.2.1", features = ["gecko-ffi"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["ws2def"] }
